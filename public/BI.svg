<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <!-- Línea superior neón -->
  <line x1="150" y1="20" x2="150" y2="135" stroke="#4ade80" stroke-width="6" />
  
  <!-- Línea inferior neón -->
  <line x1="150" y1="165" x2="150" y2="280" stroke="#4ade80" stroke-width="6" />
  
  <!-- Iniciales Baez e Ibarra -->
  <text x="135" y="210" font-family="Georgia, 'Times New Roman', serif" font-size="160" fill="#ffffff" font-weight="bold" text-anchor="end">B</text>
  <text x="165" y="210" font-family="Georgia, 'Times New Roman', serif" font-size="160" fill="#ffffff" font-weight="bold" text-anchor="start">I</text>
  
  <!-- Slogan moderno para web -->
  <text x="150" y="154" font-family="system-ui, sans-serif" font-size="16" fill="#e5e5e5" font-weight="500" text-anchor="middle" letter-spacing="4">TECH INNOVATORS</text>
</svg>
